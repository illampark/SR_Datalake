listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# ── 느린 소비자 대비 송신 큐 (2026-08-10) ──
# 배경: DB 커넥터 대량 백필 시 파이프라인 sink 가 건당 7ms(약 144건/s)로 소비하는 동안
#       기본 큐(1000건)를 초과해 "Outgoing messages are being dropped" 로 유실 발생.
#       메시지 평균 390B 기준 클라이언트당 약 39MB, 워커 4개 최악 156MB.
max_queued_messages 100000
# payload 가 커질 경우를 대비한 메모리 하드 캡 (클라이언트당 50MB)
max_queued_bytes 52428800
