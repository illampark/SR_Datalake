# Alembic configuration — SDL Multi-tenant 마이그레이션
# claudedocs/migration-guide.md § 2 참조

[alembic]
# 마이그레이션 스크립트 경로 (repo 루트 기준)
script_location = backend/migrations

# Alembic 의 ${BASE} 환경변수
prepend_sys_path = .

# 파일명 템플릿
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# DATABASE_URL 은 env.py 에서 backend.config 또는 환경변수에서 읽으므로 여기서는 비워둠.
sqlalchemy.url =

# 새 revision 생성 시 어느 브랜치인지 표시 (단일 main 만 사용)
version_locations = %(here)s/backend/migrations/versions

# 출력 인코딩
output_encoding = utf-8


# ────────────────── Logging ──────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
